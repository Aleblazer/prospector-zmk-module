description: |
  NewVision NV3007 TFT LCD controller (168RGB x 428 frame memory) on a
  MIPI DBI (4-wire SPI) bus. Typically driving 2.79" 142x428 IPS bar panels.

  Example (Pro Micro footprint, display on the hardware SPI):

    mipi_dbi {
        compatible = "zephyr,mipi-dbi-spi";
        spi-dev = <&pro_micro_spi>;
        dc-gpios = <&pro_micro_d 6 GPIO_ACTIVE_HIGH>;
        reset-gpios = <&pro_micro_d 5 GPIO_ACTIVE_LOW>;
        write-only;
        #address-cells = <1>;
        #size-cells = <0>;

        nv3007: nv3007@0 {
            compatible = "newvision,nv3007";
            reg = <0>;
            mipi-max-frequency = <8000000>;
            mipi-mode = "MIPI_DBI_MODE_SPI_4WIRE";
            width = <142>;
            height = <428>;
            rotation = <270>;
        };
    };

compatible: "newvision,nv3007"

include: [mipi-dbi-spi-device.yaml, display-controller.yaml]

properties:
  mipi-mode:
    required: true

  gram-width:
    type: int
    default: 168
    description: |
      Number of columns in the controller frame memory (native, portrait
      orientation). The NV3007 has 168 source columns.

  gram-height:
    type: int
    default: 428
    description: |
      Number of rows in the controller frame memory (native orientation).

  x-offset:
    type: int
    default: 12
    description: |
      Column offset of the first visible panel pixel inside the frame memory,
      in the native (MADCTL = 0) orientation. For the 142-wide 2.79" panels
      the glass is centred in the 168-column GRAM with 12 unused columns on
      the left and 14 on the right; the driver derives the mirrored offset
      from gram-width, width and this value.

  y-offset:
    type: int
    default: 0
    description: |
      Row offset of the first visible panel pixel inside the frame memory,
      in the native orientation.

  rotation:
    type: int
    default: 0
    enum: [0, 90, 180, 270]
    description: |
      Initial display orientation applied during driver init. 0 is the
      panel's native portrait orientation (142 wide x 428 tall). 90 and 270
      swap the reported resolution to 428 x 142 (landscape), 180 is
      upside-down portrait. The orientation can also be changed at runtime
      with display_set_orientation(). Landscape is rendered by transposing
      in the driver unless CONFIG_NV3007_HW_ROTATION is enabled.

  bgr:
    type: boolean
    description: |
      Set the MADCTL BGR bit (panel colour filter order is BGR). Leave unset
      for the ER-TFT2.79-1 which is wired RGB.

  inversion-on:
    type: boolean
    description: |
      Enable display colour inversion (INVON, 21h) after init. Some panel
      modules built on the NV3007 need this to show correct colours.

  ready-time-ms:
    type: int
    default: 40
    description: |
      Time from power-up until the controller accepts commands. The driver
      waits until this many ms after boot before starting the init sequence.
